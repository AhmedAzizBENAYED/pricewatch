apiVersion: apps/v1
kind: Deployment
metadata:
  name: playwright
  namespace: pfe-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: playwright
  template:
    metadata:
      labels:
        app: playwright
    spec:
      containers:
        - name: playwright
          image: pfe-playwright:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: FLARESOLVERR_URL
              value: "http://flaresolverr:8191/v1"
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "3Gi"
              cpu: "2000m"
          startupProbe:
            httpGet:
              path: /health
              port: 3001
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3