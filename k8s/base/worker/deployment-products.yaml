apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-products
  namespace: pfe-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-products
  template:
    metadata:
      labels:
        app: worker-products
    spec:
      terminationGracePeriodSeconds: 200
      containers:
        - name: worker
          image: pfe-worker:latest
          imagePullPolicy: Never
          command: ["sh", "-c", "celery -A src.worker.worker.celery_app worker -Q products -O fair --prefetch-multiplier=1 --concurrency=8 --loglevel=info"]
          envFrom:
            - configMapRef:
                name: worker-config
            - secretRef:
                name: worker-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A src.worker.worker.celery_app inspect ping -d celery@$HOSTNAME
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
