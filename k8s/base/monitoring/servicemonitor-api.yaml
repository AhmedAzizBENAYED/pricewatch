apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api-monitor
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - pfe-app
  selector:
    matchLabels:
      app: api
  endpoints:
    - port: "http"
      path: /metrics
      interval: 15s