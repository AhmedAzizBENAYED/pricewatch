# Copy this folder to k8s/secrets/ (git-ignored), fill in real values,
# then apply once: kubectl apply -f k8s/secrets/
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: pfe-infra
type: Opaque
stringData:
  POSTGRES_DB: pfe_db
  POSTGRES_USER: pfe_user
  POSTGRES_PASSWORD: change-me
